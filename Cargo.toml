[workspace]
resolver = "3"
members = [
    "maxima-bootstrap",
    "maxima-cli",
    "maxima-lib",
    "maxima-service",
    "maxima-tui",
    "maxima-ui",
    "maxima-resources",
]

[workspace.dependencies]
# Common Workspace Dependencies for all Maxima libs
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "net", "sync", "macros", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["stream", "rustls"], default-features = false }
base64 = "0.23.0"
thiserror = "2.0.19"
anyhow = "1.0.104"
log = "0.4.33"
regex = "1.13.1"
futures = "0.3.33"
clap = { version = "4.6.4", features = ["derive"] }
inquire = "0.9.4"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
url = "2.5.8"
directories = "6.0.0"
hex = "0.4.3"

# Common Target Specific Dependencies
windows-sys = { version = "0.61.2", features = ["Win32_System", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Console"] }
winreg = "0.56.0"
windows-service = "0.8.1"
is_elevated = "0.1.2"

[patch.crates-io]
async-compression = { git = "https://github.com/sjp761/async-compression.git", rev = "a226c72f754f942ad187cc65cb1f03df5ae26b7b", version = "0.4.42" }
flate2 = { git = "https://github.com/sjp761/flate2-rs.git", rev = "45fc9f6a56a97513b285029fee14213a2d0fe2e5", version = "1.1.10" }

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nick Whelan <cooldood909@gmail.com>", "Sean Kahler <sean@battleda.sh>", "Maxima Contributors"]
rust-version = "1.96.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release-debug]
inherits = "release"
strip = false
debug = 1

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1