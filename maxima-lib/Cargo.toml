[package]
name = "maxima-lib"
version = "1.0.0"
edition = "2024"
authors = ["Sean Kahler <sean@battleda.sh>"]
categories = ["games"]
description = "A free and open-source replacement for the EA Desktop Launcher"
keywords = ["electronic-arts", "linux-gaming"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/ArmchairDevelopers/Maxima"
documentation = "https://docs.rs/maxima"
rust-version = "1.96.0"

[dependencies]
tokio = { workspace = true }
moka = { version = "0.12.15", features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { version = "0.41.0", features = ["serialize"] }
pastey = "0.2.3"
hex = { workspace = true }
lazy_static = { workspace = true }
reqwest = { workspace = true, features = ["form", "gzip", "json"] }
base64 = { workspace = true }
base62 = "2.2.4"
log = { workspace = true }
enable-ansi-support = "0.3.1"
chrono = "0.4.45"
regex = { workspace = true }
directories = { workspace = true }
open = "5.3.6"
querystring = { workspace = true }
ureq = { version = "3.3.0", features = ["_tls"] }
sysinfo = "0.39.5"
strum_macros = { workspace = true }
sha2-const = "0.1.3"
tar = "0.4.46"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-default"] }
xz2 = "0.1.7"
zstd = "0.13.3"
toml = "1.1.2"
bytebuffer = "2.3.0"
derive-getters = "0.5.0"
derive_builder = "0.20.2"
mac_address = "1.1.8"
filetime = "0.2.29"
rand = "0.10.1"
ring = "0.17.14"
futures = { workspace = true }
prost = "0.14.4"
encoding_rs = "0.8.35"
async-compression = { version = "=0.4.42", features = ["tokio", "deflate"] }
tokio-util = { version = "0.7.18", features = ["io", "compat"] }
uuid = "1.23.4"
tokio-rustls = "0.26.4"
rustls = "0.23.41"
webpki-roots = "1.0.8"
aes = "0.9.1"
ecb = { version = "0.2.0", features = ["alloc", "block-padding", "default", "zeroize"] }
cbc = { version = "0.2.1", features = ["alloc", "block-padding", "default", "zeroize"] }
glob = "0.3.3"
md5 = "0.8.0"
bytes = "1.12.0"
async-trait = "0.1.89"
crc32fast = "1.5.0"
async-recursion = "1.1.1"
pelite = "0.10.0"
gethostname = "1.1.0"
thiserror = { workspace = true }
url = { workspace = true }
http = "1.4.2"
generic-array = "1.4.3"
rustls-pki-types = "1.14.1"

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = [
    "errhandlingapi",
    "libloaderapi",
    "shellapi",
    "psapi",
    "sddl",
    "wininet",
    "winerror",
    "iphlpapi",
    "tcpmib",
    "winsvc",
    "winbase",
    "impl-default"
] }
winreg = { workspace = true }
windows-service = { workspace = true }
is_elevated = { workspace = true }
widestring = "1.2.1"
wmi = "0.18.4"

[target.'cfg(target_os = "macos")'.dependencies]
smbios-lib = "0.9.2"

[build-dependencies]
prost-build = "0.14.4"

[lib]
name = "maxima"
path = "src/lib.rs"
